services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: university_db
    environment:
      POSTGRES_DB: university_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-university_secure_2025}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - university_net

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: university_redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - university_net

  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: university_qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - university_net

  # Backend FastAPI
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: university_backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${DB_PASSWORD:-university_secure_2025}@db:5432/university_db
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - university_net
      - coolify
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.uni-backend.rule=Host(`s7sai.cloud`) && PathPrefix(`/api`)"
      - "traefik.http.routers.uni-backend.entrypoints=https"
      - "traefik.http.routers.uni-backend.tls=true"
      - "traefik.http.routers.uni-backend.tls.certresolver=letsencrypt"
      - "traefik.http.services.uni-backend.loadbalancer.server.port=8000"

  # Frontend Next.js
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: university_frontend
    environment:
      NEXT_PUBLIC_API_URL: https://s7sai.cloud/api/v1
    depends_on:
      - backend
    networks:
      - university_net
      - coolify
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.uni-frontend.rule=Host(`s7sai.cloud`)"
      - "traefik.http.routers.uni-frontend.entrypoints=https"
      - "traefik.http.routers.uni-frontend.tls=true"
      - "traefik.http.routers.uni-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.uni-frontend.loadbalancer.server.port=3000"
      - "traefik.http.routers.uni-frontend-http.rule=Host(`s7sai.cloud`)"
      - "traefik.http.routers.uni-frontend-http.entrypoints=http"
      - "traefik.http.routers.uni-frontend-http.middlewares=redirect-to-https"

volumes:
  postgres_data:
  redis_data:
  qdrant_data:

networks:
  university_net:
    driver: bridge
  coolify:
    external: true
