<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="vibemap-api" content="/relay/api/">
<title>VibeMap — لوحة التحكم</title>
<link rel="icon" href="../img/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F4FA; --surface:#FFFFFF; --surface2:#EEEEF7; --line:#E1E1EE; --grid:#E8E8F2;
  --ink:#16162C; --ink2:#55557A; --ink3:#8484A6;
  --accent:#6A4DF5; --accentInk:#fff; --bar:#6A4DF5; --bar-hover:#5238D8;
  --ok:#0E9F6E; --warn:#B7700A; --bad:#D6334A;
  --grad:linear-gradient(100deg,#2DD4E8 0%,#7C5CFF 55%,#D24BF2 100%);
  --r:16px; color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#0A0A1C; --surface:#14142E; --surface2:#1B1B3A; --line:#28284E; --grid:#23234A;
  --ink:#F2F2FF; --ink2:#A9A9CC; --ink3:#7575A0;
  --accent:#8B72FF; --accentInk:#0A0A1C; --bar:#8B72FF; --bar-hover:#A794FF;
  --ok:#2BE4A0; --warn:#FFB547; --bad:#FF5D6E; color-scheme:dark; } }
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:400 15px/1.7 "Readex Pro",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
[hidden]{display:none!important}
.wrap{width:min(1180px,100% - 32px);margin-inline:auto}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}

/* ─── الدخول ─── */
.login{min-height:100vh;display:grid;place-items:center;padding:24px}
.login form{width:min(380px,100%);background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:28px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 50px -30px rgba(0,0,0,.35)}
.login .logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px}
.login .logo img{width:36px;height:36px}
.login p{color:var(--ink2);font-size:14px}
.input{width:100%;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);padding:0 14px}
textarea.input{height:auto;padding:10px 14px;resize:vertical}
.btn{height:42px;padding:0 18px;border-radius:12px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);white-space:nowrap}
.btn:hover{background:var(--surface2)}
.btn.pri{background:var(--accent);color:var(--accentInk);border-color:transparent}
.btn.pri:hover{filter:brightness(1.08)}
.btn.grad{background:var(--grad);color:#0A0A1C;border:0}
.btn.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.sm{height:32px;padding:0 12px;font-size:13px;border-radius:10px}
.btn[disabled]{opacity:.5;cursor:default}
.err{color:var(--bad);font-size:13px;min-height:20px}

/* ─── الرأس والتبويب ─── */
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:12px;height:62px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px}
.brand img{width:30px;height:30px}
.brand small{font-weight:500;color:var(--ink3);font-size:13px}
.top .sp{flex:1}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:10px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{padding:8px 14px;border-radius:10px;color:var(--ink2);font-weight:500;white-space:nowrap}
.tabs button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 0 var(--line),0 0 0 1px var(--line)}
main{padding:22px 0 60px}
h2{font-size:20px;font-weight:700;margin-bottom:4px}
.sub{color:var(--ink2);font-size:14px;margin-bottom:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.kpi .l{color:var(--ink2);font-size:13px}
.kpi .v{font-size:30px;font-weight:700;line-height:1.3;font-variant-numeric:tabular-nums}
.kpi .h{color:var(--ink3);font-size:12px}
.two{grid-template-columns:2fr 1fr;margin-top:14px}
.card h3{font-size:15px;font-weight:600;margin-bottom:2px}
.card .note{color:var(--ink3);font-size:12px}

/* ─── الرسم ─── */
.chart{position:relative;margin-top:12px}
.chart svg{display:block;width:100%;height:220px;overflow:visible}
.chart .gl{stroke:var(--grid);stroke-width:1}
.chart .ax{fill:var(--ink3);font-size:11px}
.chart .b{fill:var(--bar)}
.chart .hit{fill:transparent}
.chart g.col:hover .b{fill:var(--bar-hover)}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:10px;padding:6px 10px;font-size:12px;white-space:nowrap;transform:translate(-50%,-110%);opacity:0;transition:opacity .12s}
.tip b{font-size:14px}
.tview{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}
.tview td,.tview th{padding:4px 8px;border-bottom:1px solid var(--line);text-align:start}
.linkbtn{color:var(--accent);font-size:13px;font-weight:600}
.plat{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.plat .row{display:grid;grid-template-columns:70px 1fr 40px;align-items:center;gap:10px;font-size:13px}
.plat .track{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden}
.plat .fill{height:100%;border-radius:99px;background:var(--bar)}
.plat .n{text-align:end;font-variant-numeric:tabular-nums;color:var(--ink2)}
.health{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px}
.health div{background:var(--surface2);border-radius:12px;padding:10px 12px;font-size:13px}
.health b{display:block;font-size:15px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-inline-end:6px;vertical-align:1px}
.dot.ok{background:var(--ok)}.dot.bad{background:var(--bad)}

/* ─── الجداول ─── */
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.bar .input{max-width:320px;height:40px}
select.input{max-width:180px;height:40px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{color:var(--ink3);font-weight:500;text-align:start;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:hover td{background:color-mix(in srgb,var(--surface2) 60%,transparent)}
.mono{font-family:ui-monospace,"SF Mono",Menlo,monospace;direction:ltr;unicode-bidi:isolate;font-size:12.5px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:12px;background:var(--surface2);color:var(--ink2)}
.pill.ok{color:var(--ok)}.pill.bad{color:var(--bad)}.pill.warn{color:var(--warn)}
.scroll{overflow-x:auto}
.pager{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:14px;color:var(--ink2);font-size:13px}

/* ─── أدوات التطبيق ─── */
.flags{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.flag{display:flex;gap:14px;align-items:flex-start}
.flag .t{flex:1}
.flag b{display:block}
.flag span{color:var(--ink2);font-size:13px}
.sw{position:relative;width:48px;height:28px;border-radius:99px;background:var(--line);flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:inset-inline-start .2s}
.sw[aria-checked="true"]{background:var(--ok)}
.sw[aria-checked="true"]::after{inset-inline-start:23px}
.fields{display:grid;align-items:end;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin-top:14px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--ink2)}
.save{display:flex;gap:10px;align-items:center;margin-top:16px}
.ok-msg{color:var(--ok);font-size:13px}

/* ─── الساحة ─── */
.posts{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.post{display:flex;flex-direction:column;gap:8px}
.post .h{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--ink3)}
.post .tx{white-space:pre-wrap;word-break:break-word;font-size:14px}
.post img{width:100%;max-height:220px;object-fit:cover;border-radius:10px;background:var(--surface2)}
.post .acts{display:flex;gap:8px;flex-wrap:wrap}
.post.hid{opacity:.72;border-style:dashed}
.empty{text-align:center;color:var(--ink3);padding:30px}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-size:14px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100% - 32px)}
.toast.on{opacity:1}

.role{font-size:11px;padding:1px 8px;border-radius:99px;background:var(--surface2);color:var(--ink2)}
.role.owner{color:var(--accent)}
.stack{display:grid;gap:14px}
.formrow{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.formrow .f{flex:1;min-width:180px}
@media (max-width:600px){ #meChip{display:none} }
.modal{position:fixed;inset:0;z-index:40;background:rgba(10,10,28,.55);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
.modal .card{width:min(760px,100%);position:relative}
.modal .x{position:absolute;top:12px;inset-inline-end:12px}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin:12px 0}
.kv div{background:var(--surface2);border-radius:12px;padding:8px 12px;font-size:13px;color:var(--ink2)}
.kv b{display:block;color:var(--ink);font-size:14px;word-break:break-word}
.warnbox{background:color-mix(in srgb,var(--warn) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--warn) 35%,var(--line));border-radius:12px;padding:10px 12px;font-size:13px;margin-top:10px}
@media (max-width:860px){ .two{grid-template-columns:1fr} }
@media (max-width:600px){ .kpi .v{font-size:24px} .top{height:56px} .brand small{display:none} main{padding-top:16px} }
</style>
</head>
<body>

<!-- ═══ تسجيل الدخول ═══ -->
<section class="login" id="loginView" hidden>
  <form id="loginForm" autocomplete="off">
    <div class="logo"><img src="../img/logo.svg" alt="">VibeMap</div>
    <div><h2>لوحة التحكم</h2><p>لفريق الإدارة فقط. المالك يدخل باسم <b class="mono">admin</b>.</p></div>
    <input class="input" id="user" type="text" placeholder="اسم المستخدم" autocomplete="username" autocapitalize="none" spellcheck="false" dir="ltr" required>
    <input class="input" id="pw" type="password" placeholder="كلمة السر" autocomplete="current-password" required>
    <div class="err" id="loginErr" role="alert"></div>
    <button class="btn grad" type="submit" id="loginBtn">دخول</button>
  </form>
</section>

<!-- ═══ اللوحة ═══ -->
<div id="app" hidden>
  <header>
    <div class="wrap">
      <div class="top">
        <div class="brand"><img src="../img/logo.svg" alt="">VibeMap <small>لوحة التحكم</small></div>
        <div class="sp"></div>
        <span class="pill" id="meChip"></span>
        <button class="btn sm" data-act="refresh">↻ تحديث</button>
        <button class="btn sm" data-act="logout">خروج</button>
      </div>
      <nav class="tabs" aria-label="أقسام اللوحة">
        <button class="on" data-tab="overview">نظرة عامة</button>
        <button data-tab="users">المشتركين</button>
        <button data-tab="tools">أدوات التطبيق</button>
        <button data-tab="square">الساحة</button>
        <button data-tab="news">الإعلانات</button>
        <button data-tab="settings">الإعدادات</button>
      </nav>
    </div>
  </header>
  <main class="wrap">
    <section id="t-overview"></section>
    <section id="t-users" hidden></section>
    <section id="t-tools" hidden></section>
    <section id="t-square" hidden></section>
    <section id="t-news" hidden></section>
    <section id="t-settings" hidden></section>
  </main>
</div>
<div class="modal" id="modal" hidden role="dialog" aria-modal="true"></div>
<div class="toast" id="toast" role="status"></div>
<script src="admin.js"></script>
</body>
</html>
