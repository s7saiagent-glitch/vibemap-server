# لبيه (Labbeih) - Nginx server block منفصل تماماً عن radd.pro
# ضعه بملف جديد: /etc/nginx/sites-available/labbeih.conf
# ولا تلمس أي ملف خاص بـ radd.pro إطلاقاً
#
# استبدل api.labbeih.example بالدومين/الساب دومين الفعلي قبل التفعيل

# --- بدون SSL (مرحلة أولى قبل إصدار الشهادة) ---
server {
    listen 80;
    listen [::]:80;
    server_name api.labbeih.example;

    client_max_body_size 8m; # يسمح برفع مقاطع صوتية قصيرة

    # يخدم واجهة PWA المبنية (client/dist) إذا رفعتها على نفس الدومين
    root /var/www/labbeih/client-dist;
    index index.html;

    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.io يحتاج ترقية اتصال WebSocket صريحة
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400; # يبقي اتصال الـ socket حي بدون قطع
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# --- بعد تفعيل SSL عبر certbot سيضيف Certbot تلقائياً تحويلة 443 ---
